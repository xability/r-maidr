url: https://r.maidr.ai/
lang: en

home:
  title: "Accessible ggplot2 and Base R Plots with Sonification"
  description: >-
    maidr makes ggplot2 and Base R plots accessible with keyboard navigation,
    screen reader support, and sonification for blind and low-vision users.
  links:
    - text: MAIDR JavaScript core
      href: https://maidr.ai/
    - text: py-maidr for Python
      href: https://py.maidr.ai/

template:
  bootstrap: 5
  bootswatch: flatly
  opengraph:
    image:
      src: https://raw.githubusercontent.com/xability/maidr/refs/heads/main/media/logo.jpg
      alt: "maidr hex sticker logo - accessible data visualization for R"
    twitter:
      creator: "@seo_jooyoung"
      card: summary
  includes:
    # Site-wide head additions. Canonical links, og:url and the per-page
    # descriptions pkgdown cannot emit are added after the build by
    # tools/seo-postprocess.py; the home page's JSON-LD lives in
    # pkgdown/templates/in-header-home.html.
    in_header: |
      <meta property="og:type" content="website">
      <meta property="og:site_name" content="maidr">
      <meta property="og:locale" content="en_US">
      <meta name="twitter:image" content="https://raw.githubusercontent.com/xability/maidr/refs/heads/main/media/logo.jpg">
      <meta name="twitter:image:alt" content="maidr hex sticker logo - accessible data visualization for R">
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orestbida/cookieconsent@3.1.0/dist/cookieconsent.css" integrity="sha384-9KcNFt4axT+TNOVPHpwGHOm4Kv0UcMjdVya1kl+EPBQG+Vmqtz28cnx0f5PZYcnF" crossorigin="anonymous">
      <script defer src="https://cdn.jsdelivr.net/gh/orestbida/cookieconsent@3.1.0/dist/cookieconsent.umd.js" integrity="sha384-xOY5eqzqHsjfa8YYAomICWjVJ3g9q1C1tWgRF09ut5PzRJjLFSpKH7gCsIN3hKcA" crossorigin="anonymous"></script>
      <script type="text/plain" data-category="analytics">
        (function(){
          var s=document.createElement('script');
          s.async=true;
          s.src='https://www.googletagmanager.com/gtag/js?id=G-0Q5XSD4Q3P';
          document.head.appendChild(s);
          window.dataLayer=window.dataLayer||[];
          function gtag(){dataLayer.push(arguments);}
          window.gtag=gtag;
          gtag('js',new Date());
          gtag('config','G-0Q5XSD4Q3P');
        })();
      </script>
      <script type="text/plain" data-category="analytics">
        (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "vwqzk7wq0c");
      </script>

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]

# Every vignette must be listed here: pkgdown errors on an `articles:`
# config that omits one. The `navbar` field on each section puts it in the
# Articles dropdown as well as on articles/index.html.
articles:
  - title: Get started
    navbar: ~
    contents:
      - getting-started
      - shiny-integration

  - title: Examples by plot family
    desc: >-
      Worked, interactive examples of every supported plot type, split by
      family so each page stays small enough to crawl and load quickly.
    navbar: Examples
    contents:
      - articles/examples
      - articles/examples-bar-pie
      - articles/examples-distribution
      - articles/examples-scatter-line
      - articles/examples-heatmap-candlestick
      - articles/examples-multi
      - articles/examples-base-r-timeseries
      - articles/examples-base-r-experimental

reference:
  - title: Main functions
    desc: Primary user-facing functions for creating accessible plots
    contents:
      - show
      - save_html

  - title: RMarkdown integration
    desc: Functions for enabling accessible plots in RMarkdown documents
    contents:
      - maidr_on
      - maidr_off

  - title: Shiny integration
    desc: Functions for using maidr in Shiny applications
    contents:
      - render_maidr
      - maidr_output

  - title: Configuration and utilities
    desc: Functions for configuring MAIDR behavior and running examples
    contents:
      - maidr_set_fallback
      - maidr_get_fallback
      - run_example

  - title: Internal utilities
    desc: Internal functions for package developers
    contents:
      - starts_with("combine_")
      - starts_with("extract_")
      - starts_with("find_")
      - starts_with("generate_")
      - starts_with("get_")
      - starts_with("map_")
      - starts_with("organize_")
      - starts_with("process_")
