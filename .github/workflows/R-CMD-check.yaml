# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Dispatched by update-maidr-bundle.yml after it pushes a bundle refresh:
  # that push is made with GITHUB_TOKEN, which starts no push-triggered
  # workflow, so this is how a refreshed bundle gets checked (#303).
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-15-intel, r: 'release'}  # Intel, better binary availability
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: ${{ runner.os != 'macOS' }}

      # cache-version: increment to invalidate stale package caches when
      # CRAN binary URLs change (rare, ~1-2x per year)
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          cache-version: 2

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  # `R CMD check` copies the tests into `<pkg>.Rcheck/tests/` and runs them
  # there, so the tests that read `README.md` and `R/` beside them --
  # test-roxygen-orphans.R, test-plot-type-stability.R, part of
  # test-format-utils.R -- skip under the check above and only ever ran on a
  # developer's machine. This runs the suite from the source tree, where
  # they run.
  test-local:
    runs-on: ubuntu-latest
    name: testthat from the source tree

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
          cache-version: 2

      - name: Run the tests from the source tree
        run: testthat::test_local(stop_on_failure = TRUE)
        shell: Rscript {0}

  # The payload can be valid and every value announced while the chart draws
  # no highlight at all: that is what the 4.0 bundle refresh did to bar,
  # point, histogram, dodged, stacked and pie layers, and nothing here could
  # see it, because every test reads the payload and none of them runs the
  # frontend (#316). This renders each of those charts with the bundle the
  # tree ships, presses Right Arrow on it in headless Chromium, and fails
  # when no mark changes colour. It runs on the pull request that changes a
  # processor and on the dispatch a bundle refresh sends.
  highlight-smoke:
    runs-on: ubuntu-latest
    name: highlight in a browser

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
          cache-version: 2

      - name: Install the package
        run: R CMD INSTALL --no-docs --no-multiarch .

      - name: Render the charts
        run: Rscript .github/scripts/highlight-smoke.R smoke

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Pinned so the browser the check runs in changes only when someone
      # changes it here. `--no-save` keeps the tree free of a package.json.
      - name: Install Playwright and its Chromium
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium

      - name: Press Right Arrow on every chart
        run: node .github/scripts/highlight-smoke.mjs smoke
