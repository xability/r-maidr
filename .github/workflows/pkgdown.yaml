# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  # Build (but do not deploy — see the gate on the deploy step) on PRs so
  # site-breaking changes like a missing reference-index topic surface
  # before merge instead of on main.
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: tools/seo-postprocess.py dates each page from the
          # commit that last touched its source. A shallow clone has one
          # commit with no parent, so git reports that commit for every path
          # and every page would carry the build date instead.
          fetch-depth: 0

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # cache-version: increment to invalidate stale package caches when
      # CRAN binary URLs change (rare, ~1-2x per year)
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website
          cache-version: 2

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # Canonical links, og:url, noindex on 404.html and internal reference
      # topics, descriptions for the pages pkgdown leaves without one, and a
      # sitemap without the noindexed pages. pkgdown has no hook for any of
      # these, so they are added to the built HTML before it is deployed.
      - name: Add canonical links, descriptions and prune the sitemap
        run: python3 "tools/seo-postprocess.py" "docs" "https://r.maidr.ai"

      # Googlebot fetches only the first 2 MB (2,097,152 bytes, uncompressed)
      # of an HTML file and indexes nothing past that, so a page over the
      # limit is silently half-indexed. The examples gallery once weighed
      # 9 MB; this fails the build before that can happen again.
      - name: Fail on HTML pages near the Googlebot 2 MB fetch limit
        run: |
          echo "Ten largest HTML files:"
          # awk rather than `head`: `head` closes the pipe once it has its ten
          # lines, and `sort` then dies of SIGPIPE. Harmless under this step's
          # default `bash -e`, but it prints an error into every build log and
          # would fail the step outright the day someone adds `pipefail`.
          find docs -type f -name '*.html' -printf '%s %p\n' | sort -rn | awk 'NR <= 10'
          large="$(find docs -type f -name '*.html' -size +1900000c)"
          if [ -n "$large" ]; then
            echo "::error::HTML files larger than 1,900,000 bytes (Googlebot indexes only the first 2 MB):" >&2
            echo "$large" >&2
            exit 1
          fi

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
